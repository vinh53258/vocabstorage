<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Hub Pro - Smart Review</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --main-bg: #f8fafc;
            --sidebar-bg: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #1e293b;
            --accent: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--main-bg); display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        /* Sidebar Left */
        .sidebar-left { width: 70px; background: var(--sidebar-bg); border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; }
        .nav-list { flex: 1; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-list::-webkit-scrollbar { width: 0; }
        .nav-item { width: 45px; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #64748b; font-weight: bold; font-size: 14px; border-radius: 8px; transition: 0.2s; cursor: pointer; }
        .nav-item:hover { background: #f1f5f9; color: var(--primary); }
        
        .data-tools { padding: 15px 0; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .tool-icon { font-size: 20px; cursor: pointer; opacity: 0.6; transition: 0.2s; background: none; border: none; }
        .tool-icon:hover { opacity: 1; transform: scale(1.1); }

        /* Sidebar Right */
        .sidebar-right { width: 110px; background: var(--sidebar-bg); border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; padding: 10px 5px; }
        .right-nav-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .right-nav-list::-webkit-scrollbar { width: 0; }
        .special-btn { width: 90px; padding: 8px 4px; font-size: 10px; font-weight: 800; text-align: center; border-radius: 8px; cursor: pointer; text-transform: uppercase; border: 1px solid #e2e8f0; background: #fff; transition: 0.2s; }
        .btn-challenging { color: #be123c; background: #fff1f2; }
        .btn-phrase { color: #1d4ed8; background: #eff6ff; }
        .btn-topic { color: #7c3aed; background: #f5f3ff; font-weight: 600; text-transform: none; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Main Content Area */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
        .header { position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 20px; z-index: 5; border-bottom: 1px solid #e2e8f0; }
        .input-box { max-width: 600px; margin: 0 auto; }
        .input-group { display: flex; gap: 8px; }
        input { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 10px; outline: none; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .content { max-width: 700px; margin: 0 auto; width: 100%; padding: 20px 20px 300px 20px; }
        
        /* Word Card & Section titles with offset for header */
        .word-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-left: 6px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; transition: 0.3s; }
        .section-title { font-size: 28px; font-weight: 800; margin: 40px 0 20px 0; color: #334155; border-bottom: 3px solid #f1f5f9; scroll-margin-top: 210px; }

        .flash-effect { background: #fff59d !important; transform: scale(1.03); box-shadow: 0 0 15px rgba(255, 235, 59, 0.5); }
        
        .word-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .display-text { font-size: 1.17em; font-weight: bold; color: var(--text-main); }
        .pos-tag { font-size: 12px; color: #64748b; font-style: italic; font-weight: bold; }
        .topic-badge { font-size: 10px; background: #f5f3ff; color: var(--secondary); padding: 2px 8px; border-radius: 6px; font-weight: 800; border: 1px solid #ddd6fe; text-transform: uppercase; }
        .btn-speak { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.6; padding-top: 2px; }
        .example-text { font-size: 14px; color: #475569; margin-top: 8px; line-height: 1.4; font-style: italic; border-top: 1px dashed #e2e8f0; padding-top: 8px; }

        .editable-meaning { color: var(--success); font-weight: bold; cursor: pointer; border-bottom: 1px dashed transparent; transition: 0.2s; display: inline-block; min-width: 30px; }
        .editable-meaning:hover { background: #f0fdf4; border-bottom-color: var(--success); }
        .editable-meaning:focus { outline: none; background: #f0fdf4; border-bottom: 1px solid var(--success); }

        .delete-icon { position: absolute; right: 15px; top: 12px; cursor: pointer; font-size: 18px; color: #cbd5e1; }
        .delete-icon:hover { color: var(--danger); }
        .star-icon { position: absolute; right: 15px; bottom: 12px; cursor: pointer; font-size: 20px; color: #cbd5e1; }
        .star-icon.active { color: #f59e0b; }

        /* Calendar */
        #calBackdrop { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.4); z-index: 99; display: none; backdrop-filter: blur(4px); }
        #calContainer { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 360px; background: white; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border-radius: 24px; padding: 25px; display: none; z-index: 100; border: 1px solid #e2e8f0; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 15px; }
        .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 1px solid #f1f5f9; position: relative; font-weight: 600; }
        .cal-day:hover { transform: translateY(-2px); background: #f8fafc; }
        .cal-day.has-data { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .cal-day.is-today { outline: 2px solid var(--primary); outline-offset: 2px; color: var(--primary); }
        
        #reviewOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(248, 250, 252, 0.85); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .review-card { width: 95%; max-width: 520px; min-height: 400px; padding: 45px 30px; border-radius: 35px; background: white; box-shadow: 0 30px 60px -12px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; text-align: center; position: relative; display: flex; flex-direction: column; justify-content: center; }
        .review-word { font-size: 45px; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        .review-meaning { font-size: 26px; color: var(--success); font-weight: 700; margin: 25px 0; }
        .review-ex { font-style: italic; color: #475569; line-height: 1.6; border-top: 1px solid #f1f5f9; padding-top: 25px; font-size: 15px; }
        .review-controls { display: flex; gap: 20px; margin-top: 40px; justify-content: center; }
        .nav-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--primary); color: white; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .nav-btn:hover { transform: scale(1.1); background: var(--secondary); }
        .nav-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        .close-review { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 22px; cursor: pointer; color: #cbd5e1; }
        
        #confirmOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15,23,42,0.5); z-index: 2000; display: none; backdrop-filter: blur(3px); }
        #confirmBox { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 35px 30px; border-radius: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); width: 340px; text-align: center; border: 1px solid #e2e8f0; }
        .c-btn { flex: 1; padding: 14px; border-radius: 16px; border: none; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s; }
    </style>
</head>
<body onclick="closeAllModals(event)">

<div id="calBackdrop"></div>

<div id="confirmOverlay">
    <div id="confirmBox" onclick="event.stopPropagation()">
        <div class="confirm-title" id="confirmMsg" style="font-weight: 600; font-size: 17px; margin-bottom: 25px; color: #475569;"></div>
        <div style="display: flex; gap: 12px;">
            <button class="c-btn" style="background: #f1f5f9; color: #64748b;" onclick="handleConfirm(false)">Để sau nha</button>
            <button class="c-btn" style="background: var(--primary); color: white;" onclick="handleConfirm(true)">Ôn tập ngay</button>
        </div>
    </div>
</div>

<div id="reviewOverlay" onclick="event.stopPropagation()">
    <button class="close-review" onclick="closeReview()">✕</button>
    <div class="review-card" id="reviewCardContent"></div>
    <div class="review-controls">
        <button class="nav-btn" id="prevRev" onclick="changeReview(-1)">◀</button>
        <button class="nav-btn" id="speakBtn" onclick="speakReview()" style="background: var(--accent);">🔊</button>
        <button class="nav-btn" id="nextRev" onclick="changeReview(1)">▶</button>
    </div>
</div>

<div class="sidebar-left">
    <div class="nav-list" id="azNav"></div>
    <div class="data-tools">
        <button class="tool-icon" onclick="exportData()" title="Lưu JSON">💾</button>
        <button class="tool-icon" onclick="document.getElementById('importFile').click()" title="Nạp JSON">📂</button>
        <input type="file" id="importFile" hidden accept=".json" onchange="importData(event)">
    </div>
</div>

<div class="main-wrapper" id="mainScroll">
    <div class="header">
        <div class="input-box">
            <div class="input-group">
                <input type="text" id="wordInput" placeholder="Nhập từ hoặc cụm từ..." onkeypress="if(event.key==='Enter')handleAdd()" onclick="event.stopPropagation()">
                <button class="btn-add" onclick="handleAdd(); event.stopPropagation()">THÊM</button>
            </div>
            <div style="margin-top:10px; font-size:13px; display:flex; flex-direction:column; gap:5px; align-items:flex-start">
                <label style="cursor:pointer" onclick="event.stopPropagation()"><input type="checkbox" id="topicCheck" onchange="toggleTopicInput()"> Dùng Topic?</label>
                <div id="topicGroup" style="display:none; width:100%">
                    <input type="text" id="topicInput" list="topicList" placeholder="Tên Topic..." style="padding:12px; border-radius:10px; border:1px solid #ddd; outline: none;" onclick="event.stopPropagation()">
                    <datalist id="topicList"></datalist>
                </div>
            </div>
            <div id="status" style="height:20px; margin-top:5px; color:var(--primary); font-weight: bold;"></div>
        </div>
    </div>
    <div class="content" id="dictContainer"></div>
</div>

<div class="sidebar-right">
    <div class="right-nav-list">
        <div id="topicNav" style="display:flex; flex-direction:column; gap:8px"></div>
        <div style="width:100%; height:1px; background:#eee; margin:10px 0"></div>
        <div class="special-btn btn-challenging" onclick="scrollToFirst('sec-star'); event.stopPropagation()">Challenging Words</div>
        <div class="special-btn btn-phrase" onclick="scrollToFirst('sec-phrase'); event.stopPropagation()">Useful Phrases</div>
    </div>
    <div class="special-btn" onclick="toggleCalendar(); event.stopPropagation()" style="background:var(--primary); color:white; border:none; margin-top:10px">📅 LỊCH</div>
</div>

<div id="calContainer" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
        <button onclick="moveMonth(-1)" style="border:none; background:none; cursor:pointer;">◀</button>
        <b id="calLabel" style="color: var(--primary);">Month</b>
        <button onclick="moveMonth(1)" style="border:none; background:none; cursor:pointer;">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('vocab_v6_pro')) || { words: [] };
    let calDate = new Date();
    let reviewQueue = [];
    let currentRevIdx = 0;
    let confirmCallback = null;

    function capitalizeFirstOnly(str) {
        if (!str) return "";
        let lower = str.toLowerCase().trim();
        return lower.charAt(0).toUpperCase() + lower.slice(1);
    }

    async function init() {
        await migrateData(); 
        renderAZ();
        renderMain();
        renderRightNav();
        checkYesterdayReview();
    }

    function closeAllModals(e) {
        document.getElementById('calContainer').style.display = 'none';
        document.getElementById('calBackdrop').style.display = 'none';
        document.getElementById('confirmOverlay').style.display = 'none';
    }

    async function migrateData() {
        let changed = false;
        for (let w of db.words) {
            if (!w.date) { w.date = new Date(w.id || Date.now()).toISOString().split('T')[0]; changed = true; }
            if (w.pos === undefined || w.example === undefined) {
                const extra = await fetchExtraInfo(w.word);
                w.pos = extra.pos; w.example = extra.example; changed = true;
            }
        }
        if (changed) save();
    }

    async function fetchExtraInfo(word) {
        let info = { pos: "", example: "" };
        try {
            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
            const data = await res.json();
            if (data[0]) {
                info.pos = data[0].meanings[0].partOfSpeech || "";
                for (let m of data[0].meanings) {
                    let ex = m.definitions.find(d => d.example);
                    if (ex) { info.example = capitalizeFirstOnly(ex.example); break; }
                }
            }
        } catch (e) { }
        return info;
    }

    function save() { localStorage.setItem('vocab_v6_pro', JSON.stringify(db)); }

    function showConfirm(msg, cb) {
        document.getElementById('confirmMsg').innerText = msg;
        document.getElementById('confirmOverlay').style.display = 'block';
        confirmCallback = cb;
    }

    function handleConfirm(val) {
        document.getElementById('confirmOverlay').style.display = 'none';
        if (val && confirmCallback) confirmCallback();
    }

    function checkYesterdayReview() {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const ds = yesterday.toISOString().split('T')[0];
        const words = db.words.filter(w => w.date === ds);
        if (words.length > 0) {
            showConfirm(`Chào bạn, hôm qua bạn đã học được ${words.length} từ mới. Bạn có muốn dành ít phút ôn tập lại không?`, () => {
                prepareReviewQueue(words);
            });
        }
    }

    function prepareReviewQueue(selectedWords) {
        reviewQueue = [];
        const challenging = selectedWords.filter(w => w.star);
        const phrases = selectedWords.filter(w => w.isPhrase && !w.star);
        const topics = [...new Set(selectedWords.filter(w => w.topic && !w.star && !w.isPhrase).map(w => w.topic))];
        const normal = selectedWords.filter(w => !w.star && !w.isPhrase && !w.topic);

        if (challenging.length) {
            reviewQueue.push({ type: 'header', title: '⭐ Challenging Words' });
            challenging.forEach(w => reviewQueue.push({ type: 'word', data: w }));
        }
        if (phrases.length) {
            reviewQueue.push({ type: 'header', title: '💬 Useful Phrases' });
            phrases.forEach(w => reviewQueue.push({ type: 'word', data: w }));
        }
        topics.forEach(t => {
            reviewQueue.push({ type: 'header', title: `# Topic: ${t}` });
            selectedWords.filter(w => w.topic === t).forEach(w => reviewQueue.push({ type: 'word', data: w }));
        });
        if (normal.length) {
            reviewQueue.push({ type: 'header', title: '📚 New Vocabulary' });
            normal.forEach(w => reviewQueue.push({ type: 'word', data: w }));
        }

        if (reviewQueue.length > 0) {
            currentRevIdx = 0;
            document.getElementById('reviewOverlay').style.display = 'flex';
            renderReviewSlide();
        }
    }

    function renderReviewSlide() {
        const container = document.getElementById('reviewCardContent');
        const item = reviewQueue[currentRevIdx];
        const speakBtn = document.getElementById('speakBtn');
        container.innerHTML = '';

        if (item.type === 'header') {
            speakBtn.style.visibility = 'hidden';
            container.innerHTML = `
                <div style="font-size: 20px; color: #94a3b8; font-weight: 600;">BẮT ĐẦU ÔN</div>
                <div style="font-size: 32px; font-weight: 800; color: var(--secondary); margin-top: 20px;">${item.title}</div>
            `;
        } else if (item.type === 'word') {
            speakBtn.style.visibility = 'visible';
            const w = item.data;
            container.innerHTML = `
                <div style="color:#94a3b8; font-weight:700; font-size: 12px; margin-bottom:10px;">ÔN TẬP</div>
                <div class="review-word">${w.word}</div>
                <div class="pos-tag">${w.pos ? `(${w.pos})` : ''}</div>
                <div class="review-meaning">${w.meaning}</div>
                <div class="review-ex">${w.example || '...'}</div>
            `;
        }
        document.getElementById('prevRev').disabled = currentRevIdx === 0;
        document.getElementById('nextRev').innerText = currentRevIdx === reviewQueue.length - 1 ? '✔' : '▶';
    }

    function changeReview(step) {
        currentRevIdx += step;
        if (currentRevIdx >= reviewQueue.length) {
            alert("Rất tốt! Bạn đã hoàn thành bài ôn tập.");
            closeReview();
            return;
        }
        renderReviewSlide();
    }

    function closeReview() { document.getElementById('reviewOverlay').style.display = 'none'; }
    function speakReview() {
        const item = reviewQueue[currentRevIdx];
        if (item && item.type === 'word') speak(item.data.word);
    }

    function toggleCalendar() {
        const c = document.getElementById('calContainer');
        const b = document.getElementById('calBackdrop');
        const isHidden = (c.style.display === 'none' || c.style.display === '');
        c.style.display = isHidden ? 'block' : 'none';
        b.style.display = isHidden ? 'block' : 'none';
        if (isHidden) renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calGrid');
        const label = document.getElementById('calLabel');
        grid.innerHTML = '';
        const now = new Date();
        const y = calDate.getFullYear(), m = calDate.getMonth();
        label.innerText = `Tháng ${m+1}, ${y}`;
        const first = new Date(y, m, 1).getDay();
        const days = new Date(y, m+1, 0).getDate();
        
        for(let i=0; i<first; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=days; d++){
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const wordsOnDay = db.words.filter(w => w.date === ds);
            const hasData = wordsOnDay.length > 0;
            const isToday = now.toISOString().split('T')[0] === ds;

            const dayEl = document.createElement('div');
            dayEl.className = `cal-day ${hasData ? 'has-data' : ''} ${isToday ? 'is-today' : ''}`;
            dayEl.innerHTML = `${d}<div style="font-size:10px">${hasData ? '✔' : '✘'}</div>`;
            dayEl.onclick = (e) => {
                e.stopPropagation();
                if (hasData) {
                    showConfirm(`Ngày ${d}/${m+1} bạn học ${wordsOnDay.length} từ. Ôn lại nhé?`, () => {
                        prepareReviewQueue(wordsOnDay); toggleCalendar();
                    });
                } else {
                    alert("Rất tiếc hôm đó bạn không học từ nào cả");
                }
            };
            grid.appendChild(dayEl);
        }
    }
    function moveMonth(s) { calDate.setMonth(calDate.getMonth()+s); renderCalendar(); }

    async function handleAdd() {
        const wordInp = document.getElementById('wordInput');
        const topicInp = document.getElementById('topicInput');
        const status = document.getElementById('status');
        const val = wordInp.value.trim();
        if(!val) return;

        const existing = db.words.find(w => w.word.toLowerCase() === val.toLowerCase());
        if(existing) {
            status.style.color = "var(--danger)";
            status.innerText = "(tôi yêu cầu em học kĩ từ này)";
            scrollToId(`word-${existing.id}`, true);
            return;
        }

        status.style.color = "var(--primary)";
        status.innerText = "Đang tìm nghĩa...";
        try {
            const resVi = await fetch(`https://api.mymemory.translated.net/get?q=${val}&langpair=en|vi`);
            const dataVi = await resVi.json();
            const extra = await fetchExtraInfo(val);
            const entry = {
                id: Date.now(),
                word: capitalizeFirstOnly(val),
                meaning: dataVi.responseData.translatedText,
                pos: extra.pos,
                example: extra.example ? capitalizeFirstOnly(extra.example) : "",
                date: new Date().toISOString().split('T')[0],
                star: false,
                topic: document.getElementById('topicCheck').checked ? topicInp.value.trim() : null,
                isPhrase: val.split(/\s+/).length >= 3
            };
            db.words.push(entry);
            save(); renderMain(); renderRightNav();
            status.innerText = "Đã ghi nhận kiến thức mới!";
            wordInp.value = "";
            scrollToId(`word-${entry.id}`, true);
            setTimeout(()=>status.innerText="", 2500);
        } catch(e) { status.innerText = "Lỗi kết nối!"; }
    }

    function updateMeaning(id, newText) {
        const w = db.words.find(x => x.id === id);
        if(w) { w.meaning = newText; save(); }
    }

    function scrollToId(id, flash = false) {
        setTimeout(() => {
            const el = document.getElementById(id);
            if(el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                if(flash) {
                    el.classList.add('flash-effect');
                    setTimeout(() => el.classList.remove('flash-effect'), 1500);
                }
            }
        }, 100);
    }

    function scrollToFirst(id) {
        const titleEl = document.getElementById(id);
        if (titleEl) {
            titleEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            let nextCard = titleEl.nextElementSibling;
            while(nextCard && !nextCard.classList.contains('word-card')) {
                nextCard = nextCard.nextElementSibling;
            }
            if (nextCard) {
                setTimeout(() => {
                    nextCard.classList.add('flash-effect');
                    setTimeout(() => nextCard.classList.remove('flash-effect'), 1500);
                }, 600);
            }
        }
    }

    function renderMain() {
        const container = document.getElementById('dictContainer');
        container.innerHTML = '';
        
        // 1. Challenging Words
        const stars = db.words.filter(w => w.star);
        if(stars.length) {
            container.innerHTML += `<div class="section-title" id="sec-star">⭐ Challenging Words</div>`;
            stars.forEach(w => container.innerHTML += createCard(w));
        }

        // 2. A-Z
        for(let i=65; i<=90; i++){
            const char = String.fromCharCode(i);
            const list = db.words.filter(w => w.word[0].toUpperCase() === char && !w.isPhrase);
            if(list.length){
                container.innerHTML += `<div class="section-title" id="letter-${char}">${char}</div>`;
                list.sort((a,b)=>a.word.localeCompare(b.word)).forEach(w => container.innerHTML += createCard(w));
            }
        }
        
        // 3. Useful Phrases
        const phrases = db.words.filter(w => w.isPhrase);
        if(phrases.length) {
            container.innerHTML += `<div class="section-title" id="sec-phrase">Useful Phrases</div>`;
            phrases.forEach(w => container.innerHTML += createCard(w));
        }

        // 4. Topics
        const topicsWithWords = [...new Set(db.words.filter(w=>w.topic).map(w=>w.topic))];
        topicsWithWords.forEach(t => {
            container.innerHTML += `<div class="section-title" id="topic-${t}"># ${t}</div>`;
            db.words.filter(w=>w.topic === t).forEach(w => container.innerHTML += createCard(w));
        });
    }

    function createCard(w) {
        return `
            <div class="word-card" id="word-${w.id}">
                <span class="delete-icon" onclick="deleteWord(${w.id})">✕</span>
                <div class="word-header">
                    <div class="display-text">${w.word}</div>
                    ${w.pos ? `<span class="pos-tag">(${w.pos})</span>` : ''}
                    ${w.topic ? `<span class="topic-badge"># ${w.topic}</span>` : ''}
                    <button class="btn-speak" onclick="speak('${w.word}')">🔊</button>
                </div>
                <p>
                    <span style="color:var(--success); font-weight:bold">→ </span>
                    <span class="editable-meaning" contenteditable="true" 
                          onblur="updateMeaning(${w.id}, this.innerText)"
                          onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur();}">${w.meaning}</span>
                </p>
                ${w.example ? `<div class="example-text">${w.example}</div>` : ''}
                <span class="star-icon ${w.star?'active':''}" onclick="toggleStar(${w.id})">★</span>
            </div>
        `;
    }

    function deleteWord(id) {
        if(confirm("Xóa từ này?")) {
            db.words = db.words.filter(w => w.id !== id);
            save(); renderMain(); renderRightNav();
        }
    }

    function speak(txt) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(txt);
        m.lang = 'en-US'; window.speechSynthesis.speak(m);
    }

    function toggleStar(id) {
        const w = db.words.find(x => x.id === id);
        if(w) { w.star = !w.star; save(); renderMain(); }
    }

    function renderAZ() {
        const nav = document.getElementById('azNav');
        nav.innerHTML = '';
        for(let i=65; i<=90; i++) {
            const char = String.fromCharCode(i);
            nav.innerHTML += `<div class="nav-item" onclick="scrollToFirst('letter-${char}')">${char}</div>`;
        }
    }

    function renderRightNav() {
        const topicNav = document.getElementById('topicNav');
        const datalist = document.getElementById('topicList');
        topicNav.innerHTML = '';
        const topics = [...new Set(db.words.filter(w=>w.topic).map(w=>w.topic))];
        topics.forEach(t => {
            topicNav.innerHTML += `<div class="special-btn btn-topic" onclick="scrollToFirst('topic-${t}')"># ${t}</div>`;
        });
        datalist.innerHTML = topics.map(t => `<option value="${t}">`).join('');
    }

    function toggleTopicInput() {
        document.getElementById('topicGroup').style.display = document.getElementById('topicCheck').checked ? 'block' : 'none';
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "my_vocab.json"; a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                db = JSON.parse(event.target.result); save(); init();
                alert("Nạp dữ liệu thành công!");
            } catch(err) { alert("File lỗi!"); }
        };
        reader.readAsText(e.target.files[0]);
    }

    init();
</script>
</body>
</html>
